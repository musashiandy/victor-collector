[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "victor-collector"
version = "0.1.0"
description = "Open-source recon agent for VICTOR Recon — runs standalone with local AI, or connects to the cloud for deep AI triage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
victor = "victor_collector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/victor_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
